name: 07 mobile browser regression
on:
  pull_request:
    paths: ['07_skill/**', 'mobile-tests/**', 'test-helpers/**', 'playwright.mobile.config.js', 'playwright.config.js', 'package.json', '.github/actions/setup-browser-ci/**', 'package-lock.json', '.github/workflows/07-mobile.yml']
  push:
    branches: [main]
    paths: ['07_skill/**', 'mobile-tests/**', 'test-helpers/**', 'playwright.mobile.config.js', 'playwright.config.js', 'package.json', '.github/actions/setup-browser-ci/**', 'package-lock.json', '.github/workflows/07-mobile.yml']
  workflow_dispatch:
concurrency:
  group: 07-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-ci
      - run: npm run check:07
      - run: npm run test:07:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 07-mobile-results
          path: |
            mobile-test-report.json
            mobile-test-results/
          retention-days: 14
