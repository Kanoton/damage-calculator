name: 07 mobile browser regression
on:
  pull_request:
    paths: ['07_skill/**', 'mobile-tests/**', 'playwright.mobile.config.js', 'playwright.config.js', 'package.json', '.github/workflows/07-mobile.yml']
  push:
    branches: [main]
    paths: ['07_skill/**', 'mobile-tests/**', 'playwright.mobile.config.js', 'playwright.config.js', 'package.json', '.github/workflows/07-mobile.yml']
  workflow_dispatch:
concurrency:
  group: 07-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:07
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:07:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 07-mobile-results
          path: |
            mobile-test-report.json
            mobile-test-results/
          retention-days: 14
