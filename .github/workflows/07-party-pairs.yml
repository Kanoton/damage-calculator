name: 07 party pair regression
on:
  workflow_dispatch:
    inputs:
      self_ids:
        description: 'Optional comma-separated self IDs (empty runs all)'
        required: false
        default: ''
concurrency:
  group: 07-party-pairs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pairs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:07
      - run: npx playwright install --with-deps chromium
      - run: npm run test:07:pairs
        env:
          PAIR_SELF_IDS: ${{ inputs.self_ids || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 07-party-pair-results
          path: |
            pair-test-report.json
            pair-test-results/
          if-no-files-found: warn
          retention-days: 14
