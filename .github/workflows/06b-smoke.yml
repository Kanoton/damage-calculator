name: browser smoke regression

on:
  pull_request:
    paths:
      - '06b_chara/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/ci-test-scope.cjs'
      - 'scripts/test-ci-test-scope.cjs'
      - '.github/actions/setup-browser-ci/**'
      - 'tests/08-chip-reader.spec.js'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/06b-smoke.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '06b_chara/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/ci-test-scope.cjs'
      - 'scripts/test-ci-test-scope.cjs'
      - '.github/actions/setup-browser-ci/**'
      - 'tests/08-chip-reader.spec.js'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/06b-smoke.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: regression-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/test-ci-test-scope.cjs
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            const {classify}=require(process.env.GITHUB_WORKSPACE+'/scripts/ci-test-scope.cjs');
            let mode='full';
            if(context.eventName==='pull_request') {
              const files=await github.paginate(github.rest.pulls.listFiles,{...context.repo,pull_number:context.issue.number,per_page:100});
              const changes=files.map(f=>({status:({added:'A',modified:'M'})[f.status]||f.status,path:f.filename}));
              mode=files.length>=3000?'full':classify(changes,context.eventName);
            }
            core.info('CI test scope: '+mode);
            core.setOutput('mode',mode);
  smoke:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-ci
        with:
          media: 'true'
      - run: npm run test:smoke
