name: browser smoke regression

on:
  pull_request:
    paths:
      - '06b_chara/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/06b-smoke.yml'
  push:
    branches: [main]
    paths:
      - '06b_chara/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/06b-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
