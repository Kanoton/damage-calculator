name: Autumn building replay geometry research

on:
  pull_request:
    paths:
      - 'scripts/review-autumn-building-replay.py'
      - 'tests/test-autumn-building-replay.py'
      - 'scripts/review-autumn-plant-crops.py'
      - 'tests/test-autumn-plant-crops.py'
      - 'scripts/review-autumn-pot-interior.py'
      - 'tests/test-autumn-pot-interior.py'
      - 'scripts/review-autumn-pot-rim.py'
      - 'tests/test-autumn-pot-rim.py'
      - 'scripts/review-autumn-pot-temporal.py'
      - 'tests/test-autumn-pot-temporal.py'
      - 'scripts/review-autumn-camera-transition.py'
      - 'tests/test-autumn-camera-transition.py'
      - 'scripts/review-autumn-pot-track-session.py'
      - 'tests/test-autumn-pot-track-session.py'
      - 'scripts/review-autumn-pot-sequence.py'
      - 'tests/test-autumn-pot-sequence.py'
      - 'scripts/review-autumn-empty-pot-proposals.py'
      - 'tests/test-autumn-empty-pot-proposals.py'
      - 'scripts/review-autumn-empty-pot-links.py'
      - 'tests/test-autumn-empty-pot-links.py'
      - 'scripts/review-autumn-pot-auto-sequence.py'
      - 'tests/test-autumn-pot-auto-sequence.py'
      - 'scripts/review-autumn-fixed-camera-row.py'
      - 'tests/test-autumn-fixed-camera-row.py'
      - 'scripts/review-autumn-tile-sequence.py'
      - 'tests/test-autumn-tile-sequence.py'
      - 'scripts/review-autumn-typed-pot-row.py'
      - 'tests/test-autumn-typed-pot-row.py'
      - 'scripts/review-autumn-graph-context.py'
      - 'tests/test-autumn-graph-context.py'
      - 'scripts/review-autumn-red-tile-symbols.py'
      - 'tests/test-autumn-red-tile-symbols.py'
      - 'scripts/review-autumn-event-tile-symbols.py'
      - 'tests/test-autumn-event-tile-symbols.py'
      - 'scripts/review-autumn-visible-tile-triplet.py'
      - 'tests/test-autumn-visible-tile-triplet.py'
      - 'scripts/review-autumn-blue-tile-symbols.py'
      - 'tests/test-autumn-blue-tile-symbols.py'
      - 'scripts/review-autumn-five-tile-path.py'
      - 'tests/test-autumn-five-tile-path.py'
      - 'scripts/review-autumn-pot-tile-offsets.py'
      - 'tests/test-autumn-pot-tile-offsets.py'
      - 'scripts/review-autumn-pot-cross-frame.py'
      - 'tests/test-autumn-pot-cross-frame.py'
      - '.github/workflows/autumn-building-replay-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review-autumn-building-replay.py'
      - 'tests/test-autumn-building-replay.py'
      - 'scripts/review-autumn-plant-crops.py'
      - 'tests/test-autumn-plant-crops.py'
      - '.github/workflows/autumn-building-replay-review.yml'

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.0,<3' 'opencv-python-headless==4.12.0.88' 'Pillow==12.3.0'
      - run: python -m py_compile scripts/review-autumn-building-replay.py tests/test-autumn-building-replay.py scripts/review-autumn-plant-crops.py tests/test-autumn-plant-crops.py scripts/review-autumn-pot-interior.py tests/test-autumn-pot-interior.py scripts/review-autumn-pot-rim.py tests/test-autumn-pot-rim.py scripts/review-autumn-pot-temporal.py tests/test-autumn-pot-temporal.py scripts/review-autumn-camera-transition.py tests/test-autumn-camera-transition.py scripts/review-autumn-pot-track-session.py tests/test-autumn-pot-track-session.py scripts/review-autumn-pot-sequence.py tests/test-autumn-pot-sequence.py scripts/review-autumn-empty-pot-proposals.py tests/test-autumn-empty-pot-proposals.py scripts/review-autumn-empty-pot-links.py tests/test-autumn-empty-pot-links.py scripts/review-autumn-pot-auto-sequence.py tests/test-autumn-pot-auto-sequence.py scripts/review-autumn-fixed-camera-row.py tests/test-autumn-fixed-camera-row.py scripts/review-autumn-tile-sequence.py tests/test-autumn-tile-sequence.py scripts/review-autumn-typed-pot-row.py tests/test-autumn-typed-pot-row.py scripts/review-autumn-graph-context.py tests/test-autumn-graph-context.py scripts/review-autumn-red-tile-symbols.py tests/test-autumn-red-tile-symbols.py scripts/review-autumn-event-tile-symbols.py tests/test-autumn-event-tile-symbols.py scripts/review-autumn-visible-tile-triplet.py tests/test-autumn-visible-tile-triplet.py scripts/review-autumn-blue-tile-symbols.py tests/test-autumn-blue-tile-symbols.py scripts/review-autumn-five-tile-path.py tests/test-autumn-five-tile-path.py scripts/review-autumn-pot-tile-offsets.py tests/test-autumn-pot-tile-offsets.py scripts/review-autumn-pot-cross-frame.py tests/test-autumn-pot-cross-frame.py
      - run: python tests/test-autumn-building-replay.py -v
      - run: python tests/test-autumn-plant-crops.py -v
      - run: python tests/test-autumn-pot-interior.py -v
      - run: python tests/test-autumn-pot-rim.py -v
      - run: python tests/test-autumn-pot-temporal.py -v
      - run: python tests/test-autumn-camera-transition.py -v
      - run: python tests/test-autumn-pot-track-session.py -v
      - run: python tests/test-autumn-pot-sequence.py -v
      - run: python tests/test-autumn-empty-pot-proposals.py -v
      - run: python tests/test-autumn-empty-pot-links.py -v
      - run: python tests/test-autumn-pot-auto-sequence.py -v
      - run: python tests/test-autumn-fixed-camera-row.py -v
      - run: python tests/test-autumn-tile-sequence.py -v
      - run: python tests/test-autumn-typed-pot-row.py -v
      - run: python tests/test-autumn-graph-context.py -v
      - run: python tests/test-autumn-red-tile-symbols.py -v
      - run: python tests/test-autumn-event-tile-symbols.py -v
      - run: python tests/test-autumn-visible-tile-triplet.py -v
      - run: python tests/test-autumn-blue-tile-symbols.py -v
      - run: python tests/test-autumn-five-tile-path.py -v
      - run: python tests/test-autumn-pot-tile-offsets.py -v
      - run: python tests/test-autumn-pot-cross-frame.py -v
