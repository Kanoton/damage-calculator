name: 08 screen reader browser smoke

on:
  pull_request:
    paths:
      - '08_screen_reader/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/08-screen-reader.spec.js'
      - 'tests/08-world-reader.spec.js'
      - 'tests/07-skill.spec.js'
      - 'playwright.reader-sync.config.js'
      - 'scripts/check-08-hover-text.js'
      - 'scripts/build-08-monster-text.py'
      - 'scripts/build-autumn-defeat-samples.py'
      - 'scripts/build-screen-reader-defeat-references.py'
      - 'scripts/build-screen-reader-cut-references.py'
      - 'scripts/build-screen-reader-status-icons.py'
      - 'scripts/inspect-defeat-browser.cjs'
      - 'tests/fixtures/screen-reader/**'
      - 'scripts/check-07-syntax.js'
      - 'scripts/build-screen-reader-references.py'
      - 'scripts/build-mini-character-mapping.py'
      - 'scripts/build-screen-reader-profile-references.py'
      - 'scripts/build-screen-reader-self-references.py'
      - 'csv/self_portrait_mapping.csv'
      - 'scripts/build-screen-reader-left-hud-fixture.py'
      - 'scripts/build-screen-reader-star-fixture.py'
      - 'scripts/build-screen-reader-status-fixtures.py'
      - 'scripts/build-screen-reader-popup-fixtures.py'
      - 'scripts/build-screen-reader-view-references.py'
      - 'scripts/build-screen-reader-world-fixtures.py'
      - 'scripts/build-screen-reader-start-references.py'
      - 'scripts/build-screen-reader-result-banner-fixture.py'
      - 'scripts/build-screen-reader-real-result-fixture.py'
      - 'scripts/build-screen-reader-autumn-live-fixtures.py'
      - 'scripts/build-screen-reader-name-references.py'
      - 'scripts/build-screen-reader-live-status-references.py'
      - 'scripts/build-screen-reader-chip-shapes.py'
      - 'scripts/check-chip-artwork-mapping.py'
      - 'scripts/assets/status-name/**'
      - 'scripts/assets/map-text/**'
      - 'scripts/build-autumn-second-fixtures.py'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/08-screen-reader-smoke.yml'
  push:
    branches: [main]
    paths:
      - '08_screen_reader/**'
      - 'csv/mini_character_mapping.csv'
      - 'csv/chip_list.csv'
      - 'csv/chip_artwork_mapping.csv'
      - 'images/chip_icon/**'
      - 'images/UT_Relic/**'
      - 'images/UT_Hero_ProfilePhoto/**'
      - 'scripts/build-mini-character-mapping.py'
      - 'scripts/build-screen-reader-profile-references.py'
      - 'scripts/build-screen-reader-self-references.py'
      - 'csv/self_portrait_mapping.csv'
      - 'scripts/build-screen-reader-left-hud-fixture.py'
      - 'scripts/build-screen-reader-star-fixture.py'
      - 'scripts/build-screen-reader-status-fixtures.py'
      - 'scripts/build-screen-reader-popup-fixtures.py'
      - 'scripts/build-screen-reader-view-references.py'
      - 'scripts/build-screen-reader-world-fixtures.py'
      - 'scripts/build-screen-reader-start-references.py'
      - 'scripts/build-screen-reader-result-banner-fixture.py'
      - 'scripts/build-screen-reader-real-result-fixture.py'
      - 'scripts/build-screen-reader-autumn-live-fixtures.py'
      - 'scripts/build-screen-reader-name-references.py'
      - 'scripts/build-screen-reader-live-status-references.py'
      - 'scripts/build-screen-reader-chip-shapes.py'
      - 'scripts/check-chip-artwork-mapping.py'
      - 'scripts/assets/status-name/**'
      - 'scripts/assets/map-text/**'
      - 'scripts/build-autumn-second-fixtures.py'
      - 'tests/08-screen-reader.spec.js'
      - 'tests/08-world-reader.spec.js'
      - 'tests/07-skill.spec.js'
      - 'playwright.reader-sync.config.js'
      - 'scripts/check-08-hover-text.js'
      - 'scripts/build-08-monster-text.py'
      - 'scripts/build-autumn-defeat-samples.py'
      - 'scripts/build-screen-reader-defeat-references.py'
      - 'scripts/build-screen-reader-cut-references.py'
      - 'scripts/build-screen-reader-status-icons.py'
      - 'scripts/inspect-defeat-browser.cjs'
      - 'tests/fixtures/screen-reader/**'
      - 'package.json'
      - '.github/workflows/08-screen-reader-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check:08
      - run: python3 scripts/build-mini-character-mapping.py --check
      - run: python3 -m pip install Pillow==12.3.0
      - run: python3 scripts/build-autumn-defeat-samples.py --check
      - run: python3 scripts/build-screen-reader-defeat-references.py --check
      - run: python3 scripts/build-screen-reader-cut-references.py --check
      - run: python3 scripts/build-screen-reader-status-icons.py --check
      - run: python3 scripts/build-screen-reader-profile-references.py --check
      - run: python3 scripts/build-screen-reader-self-references.py --check
      - run: python3 scripts/build-screen-reader-left-hud-fixture.py --check
      - run: python3 scripts/build-screen-reader-star-fixture.py --check
      - run: python3 scripts/build-screen-reader-status-fixtures.py --check
      - run: python3 scripts/build-screen-reader-popup-fixtures.py --check
      - run: python3 scripts/build-screen-reader-view-references.py --check
      - run: python3 scripts/build-screen-reader-world-fixtures.py --check
      - run: python3 scripts/build-screen-reader-start-references.py --check
      - run: python3 scripts/build-screen-reader-result-banner-fixture.py --check
      - run: python3 scripts/build-screen-reader-real-result-fixture.py --check
      - run: python3 scripts/build-screen-reader-autumn-live-fixtures.py --check
      - run: python3 scripts/build-screen-reader-name-references.py --check
      - run: python3 scripts/build-screen-reader-live-status-references.py --check
      - run: python3 scripts/build-screen-reader-chip-shapes.py --check
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/inspect-defeat-browser.cjs
      - run: npx playwright test tests/08-world-reader.spec.js tests/08-screen-reader.spec.js -g "result banner|short autumn replay|monster text tooltip|autumn icon|autumn defeat" --workers=1
      - run: npm run test:08 -- --grep-invert "result banner|short autumn replay|monster text tooltip|autumn icon|autumn defeat|08 touch display transitions"
      - run: npx playwright test tests/08-screen-reader.spec.js --browser=webkit -g "printed status name|status names require|zoomed status|fast-changing|chip artwork|chip grid|party stars|short autumn replay|monster text tooltip|autumn icon|self portrait assets"
      - run: npx playwright test tests/08-world-reader.spec.js --browser=webkit -g "room text|autumn room|replay printed map|result banner|short autumn replay|recorded video labels|video labels abstain|autumn defeat|autumn icon status"
      - run: npx playwright test tests/07-skill.spec.js --browser=webkit -g "07 autumn data"
      - run: npm run test:08:sync -- --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 08-screen-reader-test-results
          path: |
            test-results/
            artifacts/
          retention-days: 7
