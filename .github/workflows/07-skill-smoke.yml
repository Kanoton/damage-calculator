name: 07 skill browser smoke

on:
  pull_request:
    paths:
      - '07_skill/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/07-skill.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '07_skill/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/07-skill.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:07
