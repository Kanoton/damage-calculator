name: 07 skill browser smoke

on:
  pull_request:
    paths:
      - '07_skill/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/07-skill.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/actions/setup-browser-ci/**'
      - 'package-lock.json'
      - '.github/workflows/07-skill-smoke.yml'
  push:
    branches: [main]
    paths:
      - '07_skill/**'
      - 'csv/**'
      - 'images/**'
      - 'tests/07-skill.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/actions/setup-browser-ci/**'
      - 'package-lock.json'
      - '.github/workflows/07-skill-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-ci
      - run: npm run check:07
      - run: npm run test:07
